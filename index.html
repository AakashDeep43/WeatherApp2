<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <h1>🌦️ Weather App</h1>
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div id="weatherResult" class="weather-info" style="display: none;">
      <h2 id="cityName"></h2>
      <p id="description"></p>
      <p><i class="fas fa-thermometer-half"></i> <span id="temperature"></span> °C</p>
      <div class="weather-icon" id="weatherIcon">☁️</div>
    </div>

    <p class="error" id="errorMessage"></p>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById('cityInput').value;
      const weatherResult = document.getElementById('weatherResult');
      const errorMessage = document.getElementById('errorMessage');
      weatherResult.style.display = 'none';
      errorMessage.textContent = '';

      try {
        const response = await fetch(`http://127.0.0.1:5000/weather?city=${city}`);
        const data = await response.json();

        if (response.ok) {
          document.getElementById('cityName').textContent = data.city;
          document.getElementById('description').textContent = data.description;
          document.getElementById('temperature').textContent = data.temperature;

          // Simple icon mapping
          const desc = data.description.toLowerCase();
          const icon = desc.includes('cloud') ? '☁️' :
                       desc.includes('rain') ? '🌧️' :
                       desc.includes('clear') ? '☀️' :
                       desc.includes('snow') ? '❄️' : '🌡️';
          document.getElementById('weatherIcon').textContent = icon;

          weatherResult.style.display = 'block';
        } else {
          errorMessage.textContent = data.error || 'Error fetching weather data.';
        }
      } catch (error) {
        errorMessage.textContent = 'Error connecting to the server.';
      }
    }
  </script>
</body>
</html>
